server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Must be >= MAX_UPLOAD_SIZE_MB in backend/.env, or nginx rejects
    # large uploads with its own 413 before FastAPI ever sees them.
    # Keep these two limits in sync by hand -- nginx can't read the
    # backend's .env file.
    client_max_body_size 100M;

    location /detect/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 300s;   # video processing can take a while
    }

    location /track/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 300s;
    }

    location /results/ {
        proxy_pass http://backend:8000;
    }

    location /health {
        proxy_pass http://backend:8000;
    }

    location /config {
        proxy_pass http://backend:8000;
    }

    location /outputs/ {
        proxy_pass http://backend:8000;
    }

    # SPA fallback: any other path serves index.html so client-side
    # routing (if ever added) doesn't 404 on refresh. Harmless no-op
    # today since the app has no router yet.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
